<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>App — Roomn</title>
  <meta name="description" content="Quiet, minimal tools for macOS.">

  <!-- 공통 파비콘 (/favicon.png 고정 + 캐시 강제 갱신) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=12">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=12">
  <link rel="apple-touch-icon" href="/favicon.png?v=12">

  <script>
    window.addEventListener('load', function() {
      const oldLinks = document.querySelectorAll("link[rel*='icon']");
      oldLinks.forEach(el => el.parentNode.removeChild(el));

      const newLink = document.createElement('link');
      newLink.type = 'image/png';
      newLink.rel = 'icon';
      newLink.href = '/favicon.png?v=' + new Date().getTime();
      document.head.appendChild(newLink);
    });
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --text-primary: #111111;
      --text-secondary: #4b5563;
      --text-nav: #555555;
      --text-footer: #6b7280;
      --border: #eaeaea;
      --max-width: 1160px;
      --content-max-width: 800px; /* 상세 본문 전용 컨테이너 폭 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 스티키 헤더 (1160px 유지, 가로선 제거 & 상단 정렬) */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: #ffffff;
    }

    .header {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 34px 28px 26px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .brand-lockup {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: flex-start;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.65;
    }

    .brand-logo-crop {
      width: 142px;
      height: 24px;
      position: relative;
      overflow: hidden;
      display: block;
      margin-left: -3px;
    }

    .brand-logo-crop img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 470%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav {
      display: flex;
      align-items: flex-start;
      gap: 36px;
      padding-top: 1px;
    }

    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-nav);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--text-primary);
    }

    /* 2. 상세 페이지 메인 컨테이너 (800px 중앙 집중형 단일 컬럼) */
    .main {
      max-width: var(--content-max-width);
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 112px;
      flex: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-nav);
      text-decoration: none;
      margin-bottom: 36px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--text-primary);
    }

    /* 앱 상단 히어로 영역 */
    .app-hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 52px;
    }

    /* 앱 아이콘 (108x108px, 둥근 사각형 비율 유지) */
    .app-icon-wrap {
      width: 108px;
      height: 108px;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .app-icon-wrap.dark {
      background-color: #0D0D0F;
    }

    .app-icon-wrap.navy {
      background-color: #0B2149;
    }

    .app-icon-wrap.light {
      background-color: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .app-icon-wrap svg,
    .app-icon-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 앱 타이틀 크기 확대 (46px, 자간 -0.025em) */
    .app-title {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.12;
    }

    .app-tagline {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.55;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
      max-width: 580px;
    }

    /* 알약 모양 다운로드 버튼 + ⓘ 아이콘 가로 중앙 정렬 */
    .download-action-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      margin-bottom: 36px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: -0.01em;
      line-height: 1.2;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .download-btn:hover {
      background-color: #2a2a2a;
    }

    .download-btn.disabled {
      background-color: #f0f0f0;
      color: #888888;
      pointer-events: none;
    }

    /* ⓘ 정보 아이콘 & 팝오버 래퍼 */
    .info-popover-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .info-trigger-btn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      color: #999999;
      cursor: pointer;
      border-radius: 50%;
      transition: color 0.18s ease;
    }

    .info-trigger-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .info-trigger-btn:hover,
    .info-popover-wrapper:hover .info-trigger-btn,
    .info-popover-wrapper.active .info-trigger-btn {
      color: #111111;
    }

    /* 팝오버(말풍선) 디자인 */
    .notarize-popover {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      width: 272px;
      max-width: calc(100vw - 40px);
      background-color: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      border-radius: 12px;
      padding: 14px 16px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }

    /* 마우스 이동 시 팝오버가 닫히지 않도록 이어주는 투명 브릿지 */
    .notarize-popover::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 0;
      right: 0;
      height: 12px;
    }

    @media (hover: hover) {
      .info-popover-wrapper:hover .notarize-popover {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
    }

    .info-popover-wrapper.active .notarize-popover {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .popover-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 4px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .popover-desc {
      font-size: 13px;
      color: #666666;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .popover-link {
      color: #111111;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      margin-left: 3px;
      transition: opacity 0.15s ease;
    }

    .popover-link:hover {
      opacity: 0.65;
      text-decoration: underline;
    }

    /* 메타 정보 스펙 바 */
    .meta-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 28px 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .spec-label {
      font-size: 12px;
      color: #888888;
    }

    .spec-value {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* 3. Preview 소제목 및 다중 미리보기 영역 */
    .previews-wrapper {
      display: flex;
      flex-direction: column;
    }

    .section-heading {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.25;
    }

    .previews-section {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .preview-box {
      width: 100%;
      background-color: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 380px;
    }

    .preview-box img,
    .preview-box video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .preview-placeholder {
      font-size: 14px;
      color: #888888;
      padding: 80px 20px;
      text-align: center;
    }

    /* 4. 푸터 (1160px 유지) */
    .footer-wrapper {
      width: 100%;
      border-top: 1px solid var(--border);
    }

    .footer {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 52px;
      display: flex;
      align-items: center;
      font-size: 13.5px;
      color: var(--text-footer);
    }

    @media (max-width: 900px) {
      .header {
        padding: 28px 28px 22px;
      }
      .footer {
        padding: 26px 28px 48px;
      }
    }

    /* 모바일 뷰포트 대응 및 팝오버 왼쪽/오른쪽 잘림 완벽 방지 */
    @media (max-width: 560px) {
      .header {
        padding: 24px 20px 18px;
      }
      .brand-logo-crop {
        width: 126px;
        height: 21px;
        margin-left: -2px;
      }
      .nav {
        gap: 24px;
      }
      .nav-btn {
        font-size: 15px;
      }
      .main {
        padding: 16px 20px 76px;
      }
      .back-link {
        margin-bottom: 30px;
      }
      .app-hero {
        margin-bottom: 44px;
      }
      .app-icon-wrap {
        width: 100px;
        height: 100px;
        border-radius: 22px;
        margin-bottom: 22px;
      }
      .app-title {
        font-size: 36px;
        margin-bottom: 10px;
      }
      .app-tagline {
        font-size: 16.5px;
        margin-bottom: 24px;
      }
      .download-action-row {
        margin-bottom: 32px;
      }
      /* 모바일에서는 팝오버 기준점을 .download-action-row(버튼 왼쪽 끝)로 변경하여 화면 밖 잘림 방지 */
      .info-popover-wrapper {
        position: static;
      }
      .notarize-popover {
        left: 0;
        right: auto;
        width: min(280px, calc(100vw - 40px));
        transform: translateY(4px);
      }
      @media (hover: hover) {
        .info-popover-wrapper:hover .notarize-popover {
          transform: translateY(0);
        }
      }
      .info-popover-wrapper.active .notarize-popover {
        transform: translateY(0);
      }
      .meta-specs {
        gap: 20px 28px;
        padding-top: 20px;
      }
      .section-heading {
        font-size: 21px;
        margin-bottom: 16px;
      }
      .preview-box {
        min-height: 220px;
        border-radius: 16px;
      }
      .footer {
        padding: 24px 20px 44px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <div id="header-wrapper" class="header-wrapper">
    <header class="header">
      <button type="button" class="brand-lockup" aria-label="Roomn Home" onclick="navigateTo('/', false)">
        <span class="brand-logo-crop">
          <img src="/og-image.png" alt="Roomn">
        </span>
      </button>

      <nav class="nav">
        <button type="button" class="nav-btn" onclick="navigateTo('https://archmonth.github.io/', true)">Me</button>
        <button type="button" class="nav-btn" onclick="navigateTo('/support/', false)">Support</button>
      </nav>
    </header>
  </div>

  <!-- 상세 페이지 메인 영역 -->
  <main class="main">
    <button type="button" class="back-link" onclick="navigateTo('/', false)">
      ← All Apps
    </button>

    <div id="app-detail-root"></div>
  </main>

  <!-- 하단 푸터 -->
  <div class="footer-wrapper">
    <footer class="footer">
      <span>© Roomn</span>
    </footer>
  </div>

  <script>
    const FALLBACK_APPS = [
      {
        id: "odum",
        name: "Odum",
        tagline: "Fade into focus. A minimal cycle timer.",
        platform: "macOS",
        theme: "dark",
        icon: "/assets/odum.png",
        category: "Focus",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "v1.0.7",
        isAvailable: true,
        downloadText: "Download for macOS",
        downloadUrl: "https://github.com/roomn/roomn.github.io/releases/download/odum-v1.0.7/Odum_1.0.7_aarch64.dmg",
        previews: []
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "No login. Save your links privately, access with a PIN, delete anytime.",
        platform: "macOS",
        theme: "navy",
        icon: "/assets/blnk.png",
        category: "Privacy",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "v1.0.0",
        isAvailable: true,
        downloadText: "Download for macOS",
        downloadUrl: "https://github.com/roomn/roomn.github.io/releases/download/blnk-v1.0.0/Blnk_1.0.0_aarch64.dmg",
        previews: []
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "Weigh your tasks against your daily energy.",
        platform: "macOS",
        theme: "light",
        icon: "/assets/muge.png",
        category: "Productivity",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "Soon",
        isAvailable: false,
        downloadText: "Coming Soon for macOS",
        downloadUrl: "#",
        previews: []
      }
    ];

    const APP_SVGS = {
      odum: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="odum-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <circle cx="34" cy="17.5" r="3.6" fill="#FFFFFF" filter="url(#odum-glow)" />
          <circle cx="34" cy="28.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="39.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="50.5" r="3.1" fill="#3A3A3F" />
        </svg>
      `,
      blnk: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <g fill="#FFFFFF">
            <rect x="10" y="32.4" width="16" height="3.2" rx="1.6" />
            <circle cx="34" cy="34" r="4.8" />
            <rect x="42" y="32.4" width="16" height="3.2" rx="1.6" />
          </g>
        </svg>
      `,
      muge: `
        <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g>
            <line x1="14" y1="30" x2="54" y2="30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="17" cy="24.5" r="2.8" fill="#111111"/>
            <circle cx="51" cy="24.5" r="2.8" fill="#86868B"/>
          </g>
          <path d="M 34 34.5 L 27.5 46.5 H 40.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `
    };

    function navigateTo(url, newTab = false) {
      if (newTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    function getAppIconMarkup(app) {
      if (APP_SVGS[app.id]) return APP_SVGS[app.id];
      if (app.icon) {
        const cleanIconPath = app.icon.startsWith('/') ? app.icon : '/' + app.icon;
        return `<img src="${cleanIconPath}" alt="${app.name}">`;
      }
      return `<span style="color:#fff;font-size:32px;font-weight:600;">${app.name.charAt(0)}</span>`;
    }

    function getPreviewsMarkup(app) {
      let mediaList = [];
      if (Array.isArray(app.previews) && app.previews.length > 0) {
        mediaList = app.previews;
      } else if (typeof app.preview === 'string' && app.preview.trim() !== '') {
        mediaList = [app.preview];
      }

      if (mediaList.length === 0) {
        return `
          <div class="preview-box">
            <div class="preview-placeholder">Preview image coming soon</div>
          </div>
        `;
      }

      return mediaList.map(src => {
        const cleanPath = src.startsWith('/') || src.startsWith('http') ? src : '/' + src;
        const isVideo = /\.(mp4|webm|mov)(\?.*)?$/i.test(cleanPath);

        if (isVideo) {
          return `
            <div class="preview-box">
              <video src="${cleanPath}" autoplay loop muted playsinline></video>
            </div>
          `;
        }
        return `
          <div class="preview-box">
            <img src="${cleanPath}" alt="${app.name} preview" onerror="this.parentElement.innerHTML='<div class=\\'preview-placeholder\\'>Preview image coming soon</div>'">
          </div>
        `;
      }).join('');
    }

    function toggleInfoPopover(event) {
      event.stopPropagation();
      const wrapper = document.getElementById('info-popover-wrapper');
      if (!wrapper) return;
      const isActive = wrapper.classList.toggle('active');
      const btn = wrapper.querySelector('.info-trigger-btn');
      if (btn) btn.setAttribute('aria-expanded', isActive ? 'true' : 'false');
    }

    document.addEventListener('click', (event) => {
      const wrapper = document.getElementById('info-popover-wrapper');
      if (wrapper && !wrapper.contains(event.target)) {
        wrapper.classList.remove('active');
        const btn = wrapper.querySelector('.info-trigger-btn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const wrapper = document.getElementById('info-popover-wrapper');
        if (wrapper) {
          wrapper.classList.remove('active');
          const btn = wrapper.querySelector('.info-trigger-btn');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        }
      }
    });

    function renderAppDetail(app) {
      document.title = `${app.name} — Roomn`;
      const root = document.getElementById('app-detail-root');
      const iconMarkup = getAppIconMarkup(app);
      const previewsMarkup = getPreviewsMarkup(app);

      const infoPopoverMarkup = app.isAvailable ? `
        <div id="info-popover-wrapper" class="info-popover-wrapper">
          <button
            type="button"
            class="info-trigger-btn"
            aria-label="Notarization info"
            aria-expanded="false"
            onclick="toggleInfoPopover(event)"
          >
            <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="9" r="7.25" stroke="currentColor" stroke-width="1.4"/>
              <path d="M9 8.2V12.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="9" cy="5.75" r="0.85" fill="currentColor"/>
            </svg>
          </button>

          <div class="notarize-popover" role="tooltip">
            <div class="popover-title">Not notarized yet</div>
            <div class="popover-desc">
              First launch: Privacy &amp; Security &gt; Open Anyway.
              <a href="/support/" class="popover-link">Learn why &rarr;</a>
            </div>
          </div>
        </div>
      ` : '';

      root.innerHTML = `
        <section class="app-hero">
          <div class="app-icon-wrap ${app.theme || 'dark'}">
            ${iconMarkup}
          </div>
          <h1 class="app-title">${app.name}</h1>
          <p class="app-tagline">${app.tagline}</p>

          <div class="download-action-row">
            <a
              href="${app.isAvailable ? app.downloadUrl : '#'}"
              class="download-btn ${app.isAvailable ? '' : 'disabled'}"
              ${app.isAvailable ? 'download' : 'aria-disabled="true"'}
            >
              ${app.downloadText || 'Download for macOS'}
            </a>
            ${infoPopoverMarkup}
          </div>

          <div class="meta-specs">
            <div class="spec-item">
              <span class="spec-label">Platform</span>
              <span class="spec-value">${app.platform || 'macOS'}</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Requirement</span>
              <span class="spec-value">${app.osRequirement || 'macOS 13.0+'}</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Version</span>
              <span class="spec-value">${app.version || 'v1.0.0'}</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Pricing</span>
              <span class="spec-value">${app.pricing || 'Free'}</span>
            </div>
          </div>
        </section>

        <section class="previews-wrapper" aria-label="App Previews">
          <h2 class="section-heading">Preview</h2>
          <div class="previews-section">
            ${previewsMarkup}
          </div>
        </section>
      `;
    }

    async function initAppDetail() {
      const params = new URLSearchParams(window.location.search);
      const targetId = (params.get('id') || 'odum').toLowerCase();

      let apps = FALLBACK_APPS;
      try {
        const response = await fetch('/apps.json', { cache: 'no-cache' });
        if (response.ok) {
          apps = await response.json();
        }
      } catch (e) {
        // 로드 실패 시 FALLBACK_APPS 사용
      }

      const matchedApp = apps.find(item => item.id.toLowerCase() === targetId) || apps[0];
      renderAppDetail(matchedApp);
    }

    initAppDetail();
  </script>
</body>
</html>
