<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Roomn</title>
  <meta name="description" content="Quiet, minimal tools for macOS.">

  <!-- Open Graph / Link Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Roomn">
  <meta property="og:title" content="Roomn">
  <meta property="og:description" content="Quiet, minimal tools for macOS.">
  <meta property="og:image" content="https://roomn.github.io/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- 공통 파비콘 (/favicon.png 고정 + 캐시 강제 갱신) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=12">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=12">
  <link rel="apple-touch-icon" href="/favicon.png?v=12">

  <script>
    window.addEventListener('load', function() {
      const oldLinks = document.querySelectorAll("link[rel*='icon']");
      oldLinks.forEach(el => el.parentNode.removeChild(el));

      const newLink = document.createElement('link');
      newLink.type = 'image/png';
      newLink.rel = 'icon';
      newLink.href = '/favicon.png?v=' + new Date().getTime();
      document.head.appendChild(newLink);
    });
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --text-primary: #111111;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --text-nav: #555555;
      --text-footer: #6b7280;
      --border: #eaeaea;
      --detail-max-width: 820px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 스티키 헤더 (메인 페이지와 100% 동일) */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: #ffffff;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .header-wrapper.scrolled {
      border-bottom-color: var(--border);
    }

    .header {
      width: 100%;
      padding: 32px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-lockup {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.65;
    }

    .brand-logo-crop {
      width: 162px;
      height: 28px;
      position: relative;
      overflow: hidden;
      display: block;
    }

    .brand-logo-crop img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 470%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-nav);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--text-primary);
    }

    /* 2. 앱 상세 본문 컨테이너 (Editorial / App Store 좌측 정렬) */
    .detail-main {
      max-width: var(--detail-max-width);
      width: 100%;
      margin: 0 auto;
      padding: 44px 28px 112px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    .detail-icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .detail-icon-wrap.dark {
      background-color: #0D0D0F;
    }

    .detail-icon-wrap.navy {
      background-color: #0B2149;
    }

    .detail-icon-wrap.light {
      background-color: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .detail-icon-wrap svg,
    .detail-icon-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .detail-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .detail-tagline {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.5;
      letter-spacing: -0.01em;
      margin-bottom: 26px;
      max-width: 600px;
    }

    /* 검은색 알약 모양 다운로드 버튼 */
    .download-pill-btn {
      background-color: #111111;
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 13px 26px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
      margin-bottom: 12px;
    }

    .download-pill-btn:hover {
      opacity: 0.84;
    }

    .download-pill-btn:active {
      transform: scale(0.99);
    }

    .download-pill-btn.disabled {
      background-color: var(--surface);
      color: var(--text-muted);
      cursor: default;
      pointer-events: none;
    }

    /* 다운로드 버튼 아래 공증 안내 문구 */
    .notarize-note {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .learn-why-btn {
      background: none;
      border: none;
      padding: 0;
      margin-left: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .learn-why-btn:hover {
      color: var(--text-primary);
    }

    /* 3. 메타데이터 바 (4단 가로 정보 줄) */
    .meta-bar {
      width: 100%;
      margin: 40px 0 44px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .meta-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .meta-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    /* 4. Preview(스크린샷) 영역 */
    .preview-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .preview-heading {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .preview-frame {
      width: 100%;
      background-color: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-frame img {
      width: 100%;
      height: auto;
      display: block;
    }

    .preview-placeholder {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* 5. 푸터 (메인 페이지와 100% 동일) */
    .footer {
      width: 100%;
      padding: 28px 44px 52px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      font-size: 13.5px;
      color: var(--text-footer);
    }

    @media (max-width: 900px) {
      .header {
        padding: 26px 28px;
      }
      .footer {
        padding: 26px 28px 48px;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 22px 20px;
      }
      .brand-logo-crop {
        width: 140px;
        height: 24px;
      }
      .nav {
        gap: 26px;
      }
      .nav-btn {
        font-size: 16px;
      }
      .detail-main {
        padding: 28px 20px 80px;
      }
      .detail-title {
        font-size: 28px;
      }
      .detail-tagline {
        font-size: 15.5px;
      }
      .meta-bar {
        grid-template-columns: repeat(2, 1fr);
        row-gap: 20px;
      }
      .footer {
        padding: 24px 20px 44px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 상단 스티키 헤더 (좌측 로고 & 우측 Me, Support) -->
  <div id="header-wrapper" class="header-wrapper">
    <header class="header">
      <button type="button" class="brand-lockup" aria-label="Roomn Home" onclick="navigateTo('/', false)">
        <span class="brand-logo-crop">
          <img src="/og-image.png" alt="Roomn">
        </span>
      </button>

      <nav class="nav">
        <button type="button" class="nav-btn" onclick="navigateTo('https://archmonth.github.io/', true)">Me</button>
        <button type="button" class="nav-btn" onclick="navigateTo('/support/', false)">Support</button>
      </nav>
    </header>
  </div>

  <!-- 2. 앱 상세 본문 (좌측 정렬 Editorial / App Store 구조) -->
  <main class="detail-main">
    <section class="hero-section">
      <div id="app-icon-box" class="detail-icon-wrap dark"></div>
      <h1 id="app-title" class="detail-title">Loading...</h1>
      <p id="app-tagline" class="detail-tagline"></p>

      <button type="button" id="app-download-btn" class="download-pill-btn">Download for macOS</button>

      <p class="notarize-note">
        Not notarized yet. First launch: Privacy &amp; Security &gt; Open Anyway.
        <button type="button" class="learn-why-btn" onclick="navigateTo('/support/', false)">Learn why →</button>
      </p>
    </section>

    <!-- 3. 4단 가로 메타데이터 바 -->
    <section class="meta-bar" aria-label="App Specifications">
      <div class="meta-item">
        <span class="meta-label">Category</span>
        <span id="meta-category" class="meta-value">—</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Pricing</span>
        <span id="meta-pricing" class="meta-value">Free</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Platform</span>
        <span id="meta-platform" class="meta-value">macOS 13.0+</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Version</span>
        <span id="meta-version" class="meta-value">—</span>
      </div>
    </section>

    <!-- 4. Preview (스크린샷) 영역 -->
    <section class="preview-section">
      <h2 class="preview-heading">Preview</h2>
      <div id="preview-box" class="preview-frame">
        <img id="preview-img" src="" alt="App Preview">
      </div>
    </section>
  </main>

  <!-- 5. 하단 푸터 -->
  <footer class="footer">
    <span>© Roomn</span>
  </footer>

  <script>
    const FALLBACK_APPS = [
      {
        id: "odum",
        name: "Odum",
        tagline: "Fade into focus. Minimal menu bar timer.",
        platform: "macOS",
        theme: "dark",
        icon: "/assets/odum.png",
        category: "Focus",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "v1.0.7",
        isAvailable: true,
        downloadText: "Download for macOS",
        downloadUrl: "https://github.com/archmonth/room/releases/download/odum-v1.0.7/Odum_1.0.7_aarch64.dmg",
        preview: "/odum/assets/preview.png"
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "No login. Open with a PIN, delete forever.",
        platform: "macOS",
        theme: "navy",
        icon: "/assets/blnk.png",
        category: "Privacy",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "v1.0.0",
        isAvailable: true,
        downloadText: "Download for macOS",
        downloadUrl: "https://github.com/archmonth/room/releases/download/blnk-v1.0.0/Blnk_1.0.0_aarch64.dmg",
        preview: "/blnk/assets/preview.png"
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "Weigh your tasks against your daily energy.",
        platform: "macOS",
        theme: "light",
        icon: "/assets/muge.png",
        category: "Productivity",
        pricing: "Free",
        osRequirement: "macOS 13.0+",
        version: "Soon",
        isAvailable: false,
        downloadText: "Coming Soon for macOS",
        downloadUrl: "#",
        preview: "/muge/assets/preview.png"
      }
    ];

    const APP_SVGS = {
      odum: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="odum-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <circle cx="34" cy="17.5" r="3.6" fill="#FFFFFF" filter="url(#odum-glow)" />
          <circle cx="34" cy="28.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="39.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="50.5" r="3.1" fill="#3A3A3F" />
        </svg>
      `,
      blnk: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <g fill="#FFFFFF">
            <rect x="10" y="32.4" width="16" height="3.2" rx="1.6" />
            <circle cx="34" cy="34" r="4.8" />
            <rect x="42" y="32.4" width="16" height="3.2" rx="1.6" />
          </g>
        </svg>
      `,
      muge: `
        <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="14" y1="30" x2="54" y2="30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="17" cy="24.5" r="2.8" fill="#111111"/>
          <circle cx="51" cy="24.5" r="2.8" fill="#86868B"/>
          <path d="M 34 34.5 L 27.5 46.5 H 40.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `
    };

    function navigateTo(url, newTab = false) {
      if (newTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    // URL 파라미터(?id=odum 또는 ?app=odum) 읽기
    function detectAppId() {
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get('id') || params.get('app');
      if (idParam) return idParam.trim().toLowerCase();
      return 'odum';
    }

    function getAppIconMarkup(app) {
      if (APP_SVGS[app.id]) return APP_SVGS[app.id];
      if (app.icon) {
        const cleanIconPath = app.icon.startsWith('/') ? app.icon : '/' + app.icon;
        return `<img src="${cleanIconPath}" alt="${app.name}" onerror="this.outerHTML='<span style=\\'color:#fff;font-size:28px;font-weight:600;\\'>${app.name.charAt(0)}</span>'">`;
      }
      return `<span style="color:#fff;font-size:28px;font-weight:600;">${app.name.charAt(0)}</span>`;
    }

    // 기존 폴더의 프리뷰 경로(/odum/assets/preview.png 등)를 안전하게 로드
    function resolvePreviewUrl(app) {
      if (app.preview) {
        if (app.preview.startsWith('http') || app.preview.startsWith('/')) {
          return app.preview;
        }
        // 예전 상대 경로("assets/preview.png")로 적혀 있더라도 기존 앱 폴더 기준으로 자동 보정
        return `/${app.id}/${app.preview.replace(/^\.?\//, '')}`;
      }
      return `/${app.id}/assets/preview.png`;
    }

    function renderAppDetail(app) {
      document.title = `${app.name} — Roomn`;

      const iconBox = document.getElementById('app-icon-box');
      iconBox.className = `detail-icon-wrap ${app.theme || 'dark'}`;
      iconBox.innerHTML = getAppIconMarkup(app);

      document.getElementById('app-title').textContent = app.name;
      document.getElementById('app-tagline').textContent = app.tagline;

      const downloadBtn = document.getElementById('app-download-btn');
      downloadBtn.textContent = app.downloadText || 'Download for macOS';
      if (app.isAvailable === false || !app.downloadUrl || app.downloadUrl === '#') {
        downloadBtn.classList.add('disabled');
        downloadBtn.onclick = null;
      } else {
        downloadBtn.classList.remove('disabled');
        downloadBtn.onclick = () => navigateTo(app.downloadUrl, false);
      }

      document.getElementById('meta-category').textContent = app.category || 'Utility';
      document.getElementById('meta-pricing').textContent = app.pricing || 'Free';
      document.getElementById('meta-platform').textContent = app.osRequirement || 'macOS 13.0+';
      document.getElementById('meta-version').textContent = app.version || 'v1.0.0';

      const previewBox = document.getElementById('preview-box');
      const primaryPreview = resolvePreviewUrl(app);
      const fallbackPreview = `/assets/${app.id}-preview.png`;

      previewBox.innerHTML = `
        <img
          id="preview-img"
          src="${primaryPreview}"
          alt="${app.name} Preview"
          onerror="if (this.dataset.triedFallback !== 'true') { this.dataset.triedFallback = 'true'; this.src = '${fallbackPreview}'; } else { this.outerHTML = '<div class=\\'preview-placeholder\\'>Preview image coming soon</div>'; }"
        >
      `;
    }

    async function loadAppDetail() {
      const targetId = detectAppId();
      let apps = FALLBACK_APPS;

      try {
        const response = await fetch('/apps.json', { cache: 'no-cache' });
        if (response.ok) {
          const remoteApps = await response.json();
          apps = FALLBACK_APPS.map(localApp => {
            const found = remoteApps.find(r => r.id === localApp.id);
            return found ? { ...localApp, ...found } : localApp;
          });
          remoteApps.forEach(remoteApp => {
            if (!apps.some(a => a.id === remoteApp.id)) {
              apps.push(remoteApp);
            }
          });
        }
      } catch (e) {
        // fetch 실패 시 FALLBACK_APPS 사용
      }

      const currentApp = apps.find(a => a.id.toLowerCase() === targetId) || apps[0];
      renderAppDetail(currentApp);
    }

    window.addEventListener('scroll', () => {
      const wrapper = document.getElementById('header-wrapper');
      wrapper.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    loadAppDetail();
  </script>
</body>
</html>
