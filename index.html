<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 1. 브라우저 탭 이름 및 검색 결과 제목 ("Room"으로 고정) -->
  <title>Room</title>
  <meta name="description" content="조용한 집중과 절제된 경험을 위한 미니멀 macOS 앱 큐레이션 쇼케이스.">

  <!-- 2. 구글 검색 및 공유 시 사이트 이름 고정 (Open Graph & JSON-LD) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Room">
  <meta property="og:title" content="Room">
  <meta property="og:description" content="미니멀 macOS 앱 큐레이션 쇼케이스">
  <meta property="og:url" content="https://roomn.github.io/">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Room",
    "alternateName": ["Roomn", "roomn.github.io"],
    "url": "https://roomn.github.io/"
  }
  </script>

  <!-- 3. 파비콘 (올려두신 favicon.png 단독 연결 + 브라우저 캐시 강제 갱신) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=10">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=10">
  <link rel="apple-touch-icon" href="/favicon.png?v=10">

  <script>
    window.addEventListener('load', function() {
      const oldLinks = document.querySelectorAll("link[rel*='icon']");
      oldLinks.forEach(el => el.parentNode.removeChild(el));

      const newLink = document.createElement('link');
      newLink.type = 'image/png';
      newLink.rel = 'icon';
      newLink.href = '/favicon.png?v=' + new Date().getTime();
      document.head.appendChild(newLink);
    });
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --surface-hover: #ebebee;
      --text-primary: #111111;
      --text-secondary: #6e6e73;
      --text-muted: #a1a1a6;
      --border: #e5e5ea;
      --max-width: 1040px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* 상단 헤더 (좌측 로고 + 우측 Home / Me) */
    .header {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 44px 28px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--text-primary);
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.75;
    }

    .brand-symbol {
      width: 34px;
      height: 19px;
      display: block;
    }

    .brand-text {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav a {
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--text-primary);
    }

    /* 메인 3단 갤러리 그리드 */
    .main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px 28px 96px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px 28px;
    }

    .app-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    /* 갤러리 전시 프레임 */
    .app-frame {
      aspect-ratio: 1 / 1;
      background-color: var(--surface);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.25s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-frame {
      background-color: var(--surface-hover);
      transform: translateY(-4px);
    }

    .app-icon {
      width: 38%;
      height: 38%;
      object-fit: contain;
      border-radius: 22.5%;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-icon {
      transform: scale(1.05);
    }

    /* 아이콘 이미지가 아직 없을 때 표시할 미니멀 플레이스홀더 */
    .app-icon-placeholder {
      width: 38%;
      height: 38%;
      border-radius: 22.5%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-icon-placeholder {
      transform: scale(1.05);
    }

    .app-meta {
      padding: 0 4px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .app-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .app-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .app-tagline {
      font-size: 13.5px;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      word-break: keep-all;
    }

    /* 푸터 */
    .footer {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 32px 28px 64px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text-primary);
    }

    /* 반응형 (태블릿 2단, 모바일 1단) */
    @media (max-width: 820px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 28px 20px;
      }
    }

    @media (max-width: 520px) {
      .header {
        padding: 32px 20px 28px;
      }
      .main {
        padding: 12px 20px 72px;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="header">
    <a href="/" class="brand-lockup" aria-label="Room Home">
      <svg class="brand-symbol" viewBox="0 0 34 19" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#111111" fill-rule="evenodd" clip-rule="evenodd" d="M0.5 18.5L7.8 1.5H24.8L32.2 18.5H28.1L23.1 6.8L18.1 18.5H0.5ZM9.3 6.6L6.4 13.1H12.2L9.3 6.6Z"/>
      </svg>
      <span class="brand-text">Room</span>
    </a>

    <nav class="nav">
      <a href="/" class="active">Home</a>
      <a href="https://github.com/archmonth" target="_blank" rel="noopener">Me</a>
    </nav>
  </header>

  <!-- 메인 3단 갤러리 -->
  <main class="main">
    <section id="app-gallery" class="gallery-grid" aria-label="Apps Showcase">
      <!-- apps.json 데이터가 여기에 자동으로 렌더링됩니다 -->
    </section>
  </main>

  <footer class="footer">
    <span>© Roomn</span>
    <a href="https://github.com/archmonth" target="_blank" rel="noopener">@archmonth</a>
  </footer>

  <script>
    const FALLBACK_APPS = [
      {
        id: "odum",
        name: "Odum",
        tagline: "화면의 몰입을 돕는 미니멀 어둠·배경 유틸리티",
        platform: "macOS",
        icon: "assets/odum.png",
        url: "/odum/"
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "비워진 여백에서 시작하는 방해 없는 공간",
        platform: "macOS",
        icon: "assets/blnk.png",
        url: "/blnk/"
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "작고 가벼운 작업 흐름을 위한 미니멀 도구",
        platform: "macOS",
        icon: "assets/muge.png",
        url: "/muge/"
      }
    ];

    function renderApps(apps) {
      const gallery = document.getElementById('app-gallery');
      gallery.innerHTML = apps.map(app => `
        <a href="${app.url}" class="app-card">
          <div class="app-frame">
            ${app.icon
              ? `<img src="${app.icon}" alt="${app.name} Icon" class="app-icon" onerror="this.outerHTML='<div class=\\'app-icon-placeholder\\'>${app.name.charAt(0)}</div>'">`
              : `<div class="app-icon-placeholder">${app.name.charAt(0)}</div>`
            }
          </div>
          <div class="app-meta">
            <div class="app-header">
              <h2 class="app-name">${app.name}</h2>
              <span class="app-badge">${app.platform || 'macOS'}</span>
            </div>
            <p class="app-tagline">${app.tagline}</p>
          </div>
        </a>
      `).join('');
    }

    async function loadGallery() {
      try {
        const response = await fetch('./apps.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('apps.json load failed');
        const apps = await response.json();
        renderApps(apps);
      } catch (e) {
        renderApps(FALLBACK_APPS);
      }
    }

    loadGallery();
  </script>
</body>
</html>
