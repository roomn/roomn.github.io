<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 1. 브라우저 탭 이름 및 검색 결과 제목 ("Room"으로 고정) -->
  <title>Room</title>
  <meta name="description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">

  <!-- 2. Open Graph / Link Preview Meta Tags (og-image.png 연결) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Room">
  <meta property="og:title" content="Room">
  <meta property="og:description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">
  <meta property="og:image" content="https://roomn.github.io/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://roomn.github.io/">

  <!-- Twitter / X Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Room">
  <meta name="twitter:description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">
  <meta name="twitter:image" content="https://roomn.github.io/og-image.png?v=2">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Room",
    "alternateName": ["Roomn", "roomn.github.io"],
    "url": "https://roomn.github.io/"
  }
  </script>

  <!-- 3. 파비콘 (흰색 정사각형 배경 favicon.png + 캐시 강제 갱신) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=12">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=12">
  <link rel="apple-touch-icon" href="/favicon.png?v=12">

  <script>
    window.addEventListener('load', function() {
      const oldLinks = document.querySelectorAll("link[rel*='icon']");
      oldLinks.forEach(el => el.parentNode.removeChild(el));

      const newLink = document.createElement('link');
      newLink.type = 'image/png';
      newLink.rel = 'icon';
      newLink.href = '/favicon.png?v=' + new Date().getTime();
      document.head.appendChild(newLink);
    });
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-hover: #efefef;
      --text-primary: #111111;
      --text-secondary: #6e6e73;
      --text-muted: #86868b;
      --border: #eaeaea;
      --shadow-card: 0 10px 24px rgba(0, 0, 0, 0.08);
      --max-width: 1040px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 스티키 헤더 (블러 없는 순수 화이트 #FFFFFF 고정) */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: #ffffff;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .header-wrapper.scrolled {
      border-bottom-color: var(--border);
    }

    .header {
      max-width: var(--max-width);
      margin: 0 auto;
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 2. 좌측 로고: og-image.png 여백 타이트 크롭 (높이 25px 기준) */
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-primary);
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.72;
    }

    .brand-logo-crop {
      width: 148px;
      height: 25px;
      position: relative;
      overflow: hidden;
      display: block;
    }

    .brand-logo-crop img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 470%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 우측 내비게이션 (Home · Me · Donation 컴팩트 비율) */
    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav a,
    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav a:hover,
    .nav a.active,
    .nav-btn:hover {
      color: var(--text-primary);
    }

    /* 3. 메인 3단 갤러리 그리드 (레퍼런스 사이트 비율 반영) */
    .main {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 36px 28px 96px;
      flex: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 38px 28px;
    }

    .app-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    /* 갤러리 전시 프레임 (#F7F7F7 둥근 사각형 박스) */
    .app-frame {
      aspect-ratio: 1.42 / 1;
      background-color: var(--surface);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-frame {
      background-color: var(--surface-hover);
      transform: translateY(-3px);
    }

    /* 프레임 중앙 앱 아이콘 */
    .app-icon-wrap {
      width: 84px;
      height: 84px;
      border-radius: 22.5%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-icon-wrap {
      transform: scale(1.05);
    }

    .app-icon-wrap.dark {
      background-color: #0D0D0F;
    }

    .app-icon-wrap.navy {
      background-color: #0B2149;
    }

    .app-icon-wrap.light {
      background-color: #FFFFFF;
      border: 1px solid #E5E5EA;
    }

    .app-icon-wrap svg,
    .app-icon-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 호버 시 아이콘 내부 미세 인터랙션 */
    .app-card:hover .odum-top-dot {
      animation: odum-breathe 1.6s infinite ease-in-out;
    }

    @keyframes odum-breathe {
      0%, 100% { opacity: 1; r: 3.6px; }
      50% { opacity: 0.45; r: 4.1px; }
    }

    .blnk-left-bar, .blnk-right-bar {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-card:hover .blnk-left-bar {
      transform: translateX(-1.8px);
    }

    .app-card:hover .blnk-right-bar {
      transform: translateX(1.8px);
    }

    .muge-beam-group {
      transform-origin: 34px 30px;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-card:hover .muge-beam-group {
      transform: rotate(-7deg);
    }

    /* 카드 하단 바깥쪽 메타 영역: [앱 이름] → [2줄 이내 짧은 설명] → [작은 플랫폼 태그] */
    .app-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 2px;
    }

    .app-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .app-tagline {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.45;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .app-badge {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      background-color: var(--surface);
      padding: 2px 8px;
      border-radius: 6px;
      line-height: 1.4;
    }

    /* 4. 푸터 */
    .footer {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 56px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer a,
    .footer-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .footer a:hover,
    .footer-btn:hover {
      color: var(--text-primary);
    }

    /* 반응형 (태블릿 2단, 모바일 1단) */
    @media (max-width: 820px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 32px 20px;
      }
    }

    @media (max-width: 560px) {
      .header {
        height: 64px;
        padding: 0 20px;
      }
      .brand-logo-crop {
        width: 136px;
        height: 23px;
      }
      .nav {
        gap: 18px;
      }
      .main {
        padding: 24px 20px 72px;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .footer {
        padding: 24px 20px 44px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 상단 스티키 헤더 (og-image.png 크롭 로고 & Home / Me / Donation) -->
  <div id="header-wrapper" class="header-wrapper">
    <header class="header">
      <a href="/" class="brand-lockup" aria-label="Room Home">
        <span class="brand-logo-crop">
          <img src="/og-image.png" alt="Room">
        </span>
      </a>

      <nav class="nav">
        <a href="/" class="active">Home</a>
        <a href="https://archmonth.github.io/" target="_blank" rel="noopener">Me</a>
        <button type="button" id="donation-nav-btn" class="nav-btn" onclick="copyDonationEmail()">Donation</button>
      </nav>
    </header>
  </div>

  <!-- 2. 메인 3단 갤러리 -->
  <main class="main">
    <section id="app-gallery" class="gallery-grid" aria-label="Apps Showcase"></section>
  </main>

  <!-- 3. 푸터 (원클릭 Share Room & @archmonth) -->
  <footer class="footer">
    <span>© Roomn</span>
    <div class="footer-right">
      <button type="button" id="share-room-btn" class="footer-btn" onclick="shareRoom()">Share Room</button>
      <span>·</span>
      <a href="https://archmonth.github.io/" target="_blank" rel="noopener">@archmonth</a>
    </div>
  </footer>

  <script>
    const APPS_DATA = [
      {
        id: "odum",
        name: "Odum",
        tagline: "Fade into focus. Minimal menu bar timer.",
        platform: "macOS",
        theme: "dark",
        icon: "assets/odum.png",
        url: "/odum/"
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "No login. Open with a PIN, delete forever.",
        platform: "macOS",
        theme: "navy",
        icon: "assets/blnk.png",
        url: "/blnk/"
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "Weigh your tasks against your daily energy.",
        platform: "macOS",
        theme: "light",
        icon: "assets/muge.png",
        url: "/muge/"
      }
    ];

    // 내장 고해상도 아이콘 SVG (호버 시 미세 인터랙션 클래스 포함)
    const APP_SVGS = {
      odum: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="odum-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <circle class="odum-top-dot" cx="34" cy="17.5" r="3.6" fill="#FFFFFF" filter="url(#odum-glow)" />
          <circle cx="34" cy="28.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="39.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="50.5" r="3.1" fill="#3A3A3F" />
        </svg>
      `,
      blnk: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <g fill="#FFFFFF">
            <rect class="blnk-left-bar" x="10" y="32.4" width="16" height="3.2" rx="1.6" />
            <circle cx="34" cy="34" r="4.8" />
            <rect class="blnk-right-bar" x="42" y="32.4" width="16" height="3.2" rx="1.6" />
          </g>
        </svg>
      `,
      muge: `
        <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="muge-beam-group">
            <line x1="14" y1="30" x2="54" y2="30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="17" cy="24.5" r="2.8" fill="#111111"/>
            <circle cx="51" cy="24.5" r="2.8" fill="#86868B"/>
          </g>
          <path d="M 34 34.5 L 27.5 46.5 H 40.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `
    };

    // 메인 갤러리 렌더링 (개별 서브 페이지 <a> 직접 이동 + 하단 [이름 -> 설명 -> macOS 태그] 구조)
    function renderApps(apps) {
      const gallery = document.getElementById('app-gallery');
      gallery.innerHTML = apps.map(app => {
        const svgMarkup = APP_SVGS[app.id] || APP_SVGS.odum;
        const targetUrl = app.url || `/${app.id}/`;

        return `
          <a href="${targetUrl}" class="app-card">
            <div class="app-frame">
              <div class="app-icon-wrap ${app.theme || 'dark'}">
                ${svgMarkup}
              </div>
            </div>
            <div class="app-meta">
              <h2 class="app-name">${app.name}</h2>
              <p class="app-tagline">${app.tagline}</p>
              <span class="app-badge">${app.platform || 'macOS'}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    // apps.json 로드 (외부 JSON이 있으면 병합하고, 없으면 내장 APPS_DATA 사용)
    async function loadGallery() {
      try {
        const response = await fetch('./apps.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('apps.json load failed');
        const remoteApps = await response.json();
        const merged = APPS_DATA.map(localApp => {
          const found = remoteApps.find(r => r.id === localApp.id);
          return found ? { ...localApp, ...found, tagline: localApp.tagline } : localApp;
        });
        renderApps(merged);
      } catch (e) {
        renderApps(APPS_DATA);
      }
    }

    // 클립보드 복사 유틸리티
    function copyToClipboard(text, callback) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(callback);
      } else {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        callback();
      }
    }

    // 상단 Donation 클릭 시 모달 없이 즉시 이메일 복사
    function copyDonationEmail() {
      const email = "inkevc@gmail.com";
      const btn = document.getElementById('donation-nav-btn');
      copyToClipboard(email, () => {
        btn.textContent = 'Email Copied ✓';
        setTimeout(() => { btn.textContent = 'Donation'; }, 1600);
      });
    }

    // 푸터 Share Room 링크 복사
    function shareRoom() {
      const roomUrl = "https://roomn.github.io/";
      const btn = document.getElementById('share-room-btn');
      copyToClipboard(roomUrl, () => {
        btn.textContent = 'Copied ✓';
        setTimeout(() => { btn.textContent = 'Share Room'; }, 1500);
      });
    }

    // 스크롤 시 스티키 헤더 하단 헤어라인 표시
    window.addEventListener('scroll', () => {
      const wrapper = document.getElementById('header-wrapper');
      wrapper.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    loadGallery();
  </script>
</body>
</html>
