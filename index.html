<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Roomn</title>
  <meta name="description" content="Quiet, minimal tools for macOS.">
  <link rel="canonical" href="https://roomn.github.io/">

  <!-- 1. 구글 검색 및 소셜 공유(Open Graph / Twitter) 메타 태그 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Roomn">
  <meta property="og:title" content="Roomn">
  <meta property="og:description" content="Quiet, minimal tools for macOS.">
  <meta property="og:url" content="https://roomn.github.io/">
  <meta property="og:image" content="https://roomn.github.io/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Roomn">
  <meta name="twitter:description" content="Quiet, minimal tools for macOS.">
  <meta name="twitter:image" content="https://roomn.github.io/og-image.png">

  <!-- 2. 구글 검색 로봇이 파비콘을 놓치지 않도록 정적 태그 고정 (동적 삭제 스크립트 제거) -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- 3. 구글 검색 결과에 사이트 이름('Roomn')을 정확히 표시하기 위한 구조화 데이터 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Roomn",
    "url": "https://roomn.github.io/"
  }
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --text-primary: #111111;
      --text-secondary: #4b5563;
      --text-nav: #555555;
      --text-footer: #6b7280;
      --border: #e5e7eb;
      --max-width: 1400px; /* 1160px -> 1400px 확장 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scrollbar-gutter: stable; /* 페이지 이동 시 스크롤바 유무로 인한 로고 흔들림 방지 */
      overflow-x: clip;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
    }

    /* 1. 상단 스티키 헤더 (1400px 칼각 정렬) */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: #ffffff;
    }

    .header {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 34px 28px 26px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .brand-lockup {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: flex-start;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.65;
    }

    .brand-logo-crop {
      width: 142px;
      height: 24px;
      position: relative;
      overflow: hidden;
      display: block;
      margin-left: -3px;
    }

    .brand-logo-crop img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 470%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav {
      display: flex;
      align-items: flex-start;
      gap: 36px;
      padding-top: 1px;
    }

    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-nav);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-btn:hover {
      color: var(--text-primary);
    }

    /* 2. 메인 앱 갤러리 그리드 */
    .main {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 20px 28px 112px;
      flex: 1;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 44px 32px;
      align-items: stretch;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      background-color: var(--surface);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .app-card:hover .card-thumb {
      background-color: #f1f1f1;
    }

    .card-icon-wrap {
      width: 104px;
      height: 104px;
      border-radius: 23px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-card:hover .card-icon-wrap {
      transform: scale(1.03);
    }

    .card-icon-wrap.dark {
      background-color: #0D0D0F;
    }

    .card-icon-wrap.navy {
      background-color: #0B2149;
    }

    .card-icon-wrap.light {
      background-color: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .card-icon-wrap svg,
    .card-icon-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-tagline {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      min-height: 3em; /* 1줄/2줄 설명 관계없이 하단 배지 수평 정렬 고정 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      line-height: 1.3;
      background-color: #ffffff;
    }

    /* 3. 하단 푸터 (상단 가로선 제거 완료) */
    .footer-wrapper {
      width: 100%;
    }

    .footer {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 52px;
      display: flex;
      align-items: center;
      font-size: 13.5px;
      color: var(--text-footer);
    }

    /* 반응형 대응 */
    @media (max-width: 960px) {
      .apps-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 36px 24px;
      }
      .header {
        padding: 28px 28px 22px;
      }
      .footer {
        padding: 26px 28px 48px;
      }
    }

    @media (max-width: 560px) {
      .header {
        padding: 24px 20px 18px;
      }
      .brand-logo-crop {
        width: 126px;
        height: 21px;
        margin-left: -2px;
      }
      .nav {
        gap: 24px;
      }
      .nav-btn {
        font-size: 15px;
      }
      .main {
        padding: 12px 20px 76px;
      }
      .apps-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .card-tagline {
        min-height: 0;
      }
      .footer {
        padding: 24px 20px 44px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <div class="header-wrapper">
    <header class="header">
      <button type="button" class="brand-lockup" aria-label="Roomn Home" onclick="navigateTo('/', false)">
        <span class="brand-logo-crop">
          <img src="/og-image.png" alt="Roomn">
        </span>
      </button>

      <nav class="nav">
        <button type="button" class="nav-btn" onclick="navigateTo('https://archmonth.github.io/', true)">Me</button>
        <button type="button" class="nav-btn" onclick="navigateTo('/support/', false)">Support</button>
      </nav>
    </header>
  </div>

  <!-- 메인 앱 목록 -->
  <main class="main">
    <div id="apps-grid" class="apps-grid"></div>
  </main>

  <!-- 하단 푸터 (구분선 없음) -->
  <div class="footer-wrapper">
    <footer class="footer">
      <span>© Roomn</span>
    </footer>
  </div>

  <script>
    const FALLBACK_APPS = [
      {
        id: "odum",
        name: "Odum",
        tagline: "Fade into focus. A minimal cycle timer.",
        platform: "macOS",
        theme: "dark",
        icon: "/assets/odum.png"
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "No login. Save your links privately, access with a PIN, delete anytime.",
        platform: "macOS",
        theme: "navy",
        icon: "/assets/blnk.png"
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "Weigh your tasks against your daily energy.",
        platform: "macOS",
        theme: "light",
        icon: "/assets/muge.png"
      }
    ];

    const APP_SVGS = {
      odum: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="odum-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <circle cx="34" cy="17.5" r="3.6" fill="#FFFFFF" filter="url(#odum-glow)" />
          <circle cx="34" cy="28.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="39.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="50.5" r="3.1" fill="#3A3A3F" />
        </svg>
      `,
      blnk: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <g fill="#FFFFFF">
            <rect x="10" y="32.4" width="16" height="3.2" rx="1.6" />
            <circle cx="34" cy="34" r="4.8" />
            <rect x="42" y="32.4" width="16" height="3.2" rx="1.6" />
          </g>
        </svg>
      `,
      muge: `
        <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g>
            <line x1="14" y1="30" x2="54" y2="30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="17" cy="24.5" r="2.8" fill="#111111"/>
            <circle cx="51" cy="24.5" r="2.8" fill="#86868B"/>
          </g>
          <path d="M 34 34.5 L 27.5 46.5 H 40.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `
    };

    function navigateTo(url, newTab = false) {
      if (newTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    function getAppIconMarkup(app) {
      if (APP_SVGS[app.id]) return APP_SVGS[app.id];
      if (app.icon) {
        const cleanIconPath = app.icon.startsWith('/') ? app.icon : '/' + app.icon;
        return `<img src="${cleanIconPath}" alt="${app.name}">`;
      }
      return `<span style="color:#fff;font-size:32px;font-weight:600;">${app.name.charAt(0)}</span>`;
    }

    function renderApps(apps) {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = apps.map(app => `
        <a href="/app/?id=${encodeURIComponent(app.id)}" class="app-card">
          <div class="card-thumb">
            <div class="card-icon-wrap ${app.theme || 'dark'}">
              ${getAppIconMarkup(app)}
            </div>
          </div>
          <h2 class="card-title">${app.name}</h2>
          <p class="card-tagline">${app.tagline}</p>
          <div class="card-badges">
            <span class="platform-badge">${app.platform || 'macOS'}</span>
          </div>
        </a>
      `).join('');
    }

    async function initHome() {
      let apps = FALLBACK_APPS;
      try {
        const response = await fetch('/apps.json', { cache: 'no-cache' });
        if (response.ok) {
          apps = await response.json();
        }
      } catch (e) {
        // 오프라인/로컬 환경에서는 FALLBACK_APPS 사용
      }
      renderApps(apps);
    }

    initHome();
  </script>
</body>
</html>
