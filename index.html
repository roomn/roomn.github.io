<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Roomn</title>
  <meta name="description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">

  <!-- Open Graph / Link Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Roomn">
  <meta property="og:title" content="Roomn">
  <meta property="og:description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">
  <meta property="og:image" content="https://roomn.github.io/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://roomn.github.io/">

  <!-- Twitter / X Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Roomn">
  <meta name="twitter:description" content="Quiet, minimal tools for macOS. Odum, Blnk, and Muge.">
  <meta name="twitter:image" content="https://roomn.github.io/og-image.png?v=2">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Roomn",
    "alternateName": ["Room", "roomn.github.io"],
    "url": "https://roomn.github.io/"
  }
  </script>

  <!-- 공통 파비콘 (/favicon.png 고정 + 캐시 강제 갱신) -->
  <link rel="icon" type="image/png" href="/favicon.png?v=12">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=12">
  <link rel="apple-touch-icon" href="/favicon.png?v=12">

  <script>
    window.addEventListener('load', function() {
      const oldLinks = document.querySelectorAll("link[rel*='icon']");
      oldLinks.forEach(el => el.parentNode.removeChild(el));

      const newLink = document.createElement('link');
      newLink.type = 'image/png';
      newLink.rel = 'icon';
      newLink.href = '/favicon.png?v=' + new Date().getTime();
      document.head.appendChild(newLink);
    });
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-hover: #f0f0f0;
      --text-primary: #111111;
      --text-secondary: #4b5563;
      --text-nav: #555555;
      --text-footer: #6b7280;
      --tag-text: #374151;
      --tag-border: #e5e7eb;
      --border: #eaeaea;
      --max-width: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 스티키 헤더 (모든 페이지 공통) */
    .header-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: #ffffff;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .header-wrapper.scrolled {
      border-bottom-color: var(--border);
    }

    .header {
      width: 100%;
      padding: 32px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-lockup {
      background: none;
      border: none;
      padding: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .brand-lockup:hover {
      opacity: 0.65;
    }

    .brand-logo-crop {
      width: 162px;
      height: 28px;
      position: relative;
      overflow: hidden;
      display: block;
    }

    .brand-logo-crop img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 470%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 우측 상단 메뉴: Me, Support (Regular 굵기, 수평 정렬, 간격 36px) */
    .nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-nav);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--text-primary);
    }

    /* 2. 메인 3단 갤러리 그리드 */
    .main {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 28px 28px 112px;
      flex: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 32px;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
    }

    .app-frame {
      aspect-ratio: 4 / 3;
      background-color: var(--surface);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }

    .app-card:hover .app-frame {
      background-color: var(--surface-hover);
    }

    .app-icon-wrap {
      width: 104px;
      height: 104px;
      border-radius: 23px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.2s ease;
    }

    .app-card:hover .app-icon-wrap {
      transform: scale(1.03);
    }

    .app-icon-wrap.dark {
      background-color: #0D0D0F;
    }

    .app-icon-wrap.navy {
      background-color: #0B2149;
    }

    .app-icon-wrap.light {
      background-color: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .app-icon-wrap svg,
    .app-icon-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 호버 시 아이콘 내부 미세 인터랙션 */
    .app-card:hover .odum-top-dot {
      animation: odum-breathe 1.6s infinite ease-in-out;
    }

    @keyframes odum-breathe {
      0%, 100% { opacity: 1; r: 3.6px; }
      50% { opacity: 0.45; r: 4.1px; }
    }

    .blnk-left-bar, .blnk-right-bar {
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-card:hover .blnk-left-bar {
      transform: translateX(-1.8px);
    }

    .app-card:hover .blnk-right-bar {
      transform: translateX(1.8px);
    }

    .muge-beam-group {
      transform-origin: 34px 30px;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-card:hover .muge-beam-group {
      transform: rotate(-7deg);
    }

    .app-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 2px;
    }

    .app-name {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .app-tagline {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .app-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--tag-text);
      background-color: #ffffff;
      border: 1px solid var(--tag-border);
      padding: 3px 9px;
      border-radius: 6px;
      line-height: 1.4;
    }

    /* 3. 푸터 (모든 페이지 공통: 좌측 © Roomn 단독) */
    .footer {
      width: 100%;
      padding: 28px 44px 52px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      font-size: 13.5px;
      color: var(--text-footer);
    }

    @media (max-width: 900px) {
      .header {
        padding: 26px 28px;
      }
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 36px 24px;
      }
      .footer {
        padding: 26px 28px 48px;
      }
    }

    @media (max-width: 560px) {
      .header {
        padding: 22px 20px;
      }
      .brand-logo-crop {
        width: 140px;
        height: 24px;
      }
      .nav {
        gap: 26px;
      }
      .nav-btn {
        font-size: 16px;
      }
      .main {
        padding: 20px 20px 76px;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .footer {
        padding: 24px 20px 44px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 (좌측 로고 & 우측 Me, Support) -->
  <div id="header-wrapper" class="header-wrapper">
    <header class="header">
      <button type="button" class="brand-lockup" aria-label="Roomn Home" onclick="navigateTo('/', false)">
        <span class="brand-logo-crop">
          <img src="/og-image.png" alt="Roomn">
        </span>
      </button>

      <nav class="nav">
        <button type="button" class="nav-btn" onclick="navigateTo('https://archmonth.github.io/', true)">Me</button>
        <button type="button" class="nav-btn" onclick="navigateTo('/support/', false)">Support</button>
      </nav>
    </header>
  </div>

  <!-- 메인 3단 갤러리 -->
  <main class="main">
    <section id="app-gallery" class="gallery-grid" aria-label="Apps Showcase"></section>
  </main>

  <!-- 하단 푸터 -->
  <footer class="footer">
    <span>© Roomn</span>
  </footer>

  <script>
    const FALLBACK_APPS = [
      {
        id: "odum",
        name: "Odum",
        tagline: "Fade into focus. Minimal menu bar timer.",
        platform: "macOS",
        theme: "dark",
        icon: "/assets/odum.png"
      },
      {
        id: "blnk",
        name: "Blnk",
        tagline: "No login. Open with a PIN, delete forever.",
        platform: "macOS",
        theme: "navy",
        icon: "/assets/blnk.png"
      },
      {
        id: "muge",
        name: "Muge",
        tagline: "Weigh your tasks against your daily energy.",
        platform: "macOS",
        theme: "light",
        icon: "/assets/muge.png"
      }
    ];

    const APP_SVGS = {
      odum: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="odum-glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <circle class="odum-top-dot" cx="34" cy="17.5" r="3.6" fill="#FFFFFF" filter="url(#odum-glow)" />
          <circle cx="34" cy="28.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="39.5" r="3.1" fill="#3A3A3F" />
          <circle cx="34" cy="50.5" r="3.1" fill="#3A3A3F" />
        </svg>
      `,
      blnk: `
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="66" height="66" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
          <g fill="#FFFFFF">
            <rect class="blnk-left-bar" x="10" y="32.4" width="16" height="3.2" rx="1.6" />
            <circle cx="34" cy="34" r="4.8" />
            <rect class="blnk-right-bar" x="42" y="32.4" width="16" height="3.2" rx="1.6" />
          </g>
        </svg>
      `,
      muge: `
        <svg viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="muge-beam-group">
            <line x1="14" y1="30" x2="54" y2="30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="17" cy="24.5" r="2.8" fill="#111111"/>
            <circle cx="51" cy="24.5" r="2.8" fill="#86868B"/>
          </g>
          <path d="M 34 34.5 L 27.5 46.5 H 40.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      `
    };

    function navigateTo(url, newTab = false) {
      if (newTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    function handleCardKeydown(event, url) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        navigateTo(url, false);
      }
    }

    function getAppIconMarkup(app) {
      if (APP_SVGS[app.id]) return APP_SVGS[app.id];
      if (app.icon) {
        const cleanIconPath = app.icon.startsWith('/') ? app.icon : '/' + app.icon;
        return `<img src="${cleanIconPath}" alt="${app.name}" onerror="this.outerHTML='<span style=\\'color:#fff;font-size:32px;font-weight:600;\\'>${app.name.charAt(0)}</span>'">`;
      }
      return `<span style="color:#fff;font-size:32px;font-weight:600;">${app.name.charAt(0)}</span>`;
    }

    function renderApps(apps) {
      const gallery = document.getElementById('app-gallery');
      gallery.innerHTML = apps.map(app => {
        const iconMarkup = getAppIconMarkup(app);
        // 단일 상세 페이지(/app/?id=앱ID)로 라우팅 통일
        const targetUrl = `/app/?id=${encodeURIComponent(app.id)}`;

        return `
          <div
            role="link"
            tabindex="0"
            class="app-card"
            onclick="navigateTo('${targetUrl}', false)"
            onkeydown="handleCardKeydown(event, '${targetUrl}')"
            aria-label="${app.name} - ${app.tagline}"
          >
            <div class="app-frame">
              <div class="app-icon-wrap ${app.theme || 'dark'}">
                ${iconMarkup}
              </div>
            </div>
            <div class="app-meta">
              <h2 class="app-name">${app.name}</h2>
              <p class="app-tagline">${app.tagline}</p>
              <span class="app-badge">${app.platform || 'macOS'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadGallery() {
      try {
        const response = await fetch('/apps.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('apps.json load failed');
        const remoteApps = await response.json();
        renderApps(remoteApps);
      } catch (e) {
        renderApps(FALLBACK_APPS);
      }
    }

    window.addEventListener('scroll', () => {
      const wrapper = document.getElementById('header-wrapper');
      wrapper.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    loadGallery();
  </script>
</body>
</html>
